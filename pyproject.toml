[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dslogic-tool"
version = "0.1.0"
description = "Drive a DreamSourceLab DSLogic U3Pro32/U3Pro16: capture, trigger, decode, save to DSView .dsl"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [{ name = "Wong Yiek Heng", email = "yiekheng@04080616.xyz" }]
dependencies = ["numpy>=2.1", "libusb1>=3.1"]

[project.optional-dependencies]
view = ["pyqtgraph>=0.13.7", "PySide6>=6.8", "matplotlib>=3.9"]
mcp = ["mcp>=2.3,<3", "matplotlib>=3.9"]
test = ["pytest>=8", "pyqtgraph>=0.13.7", "PySide6>=6.8", "matplotlib>=3.9", "mcp>=2.3,<3"]

[project.urls]
Repository = "https://github.com/heng5411/dslogic-mcp"

[project.scripts]
dslogic = "dslogic.cli:main"

[tool.setuptools]
packages = ["dslogic", "dslogic.decoders"]

[tool.setuptools.package-data]
dslogic = ["res/*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
